name: informal_frog_macro
description: "A Windows desktop application for Informal Frog Macro automation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  window_manager: ^0.3.9
  intl: ^0.19.0
  provider: ^6.1.4
  path: ^1.9.0
  win32: ^5.8.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/templates/
    - assets/fonts/
